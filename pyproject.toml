[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doomed-prism"
version = "0.1.0"
description = "A publication-safe foundation for the PewPew Engine project."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "PySide6>=6.7,<7"]
raven = ["PySide6>=6.7,<7"]

[project.scripts]
doomed-prism = "pewpew.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:pytest-qt"
